[project]
name = "claudia"
version = "0.1.0"
description = "Claudia - Skirts and Outdoor Shoes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]